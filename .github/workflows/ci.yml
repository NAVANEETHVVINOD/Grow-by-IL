name: Grow~ CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  quality_gate:
    name: "Quality Gate (CI)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Dependency Integrity
        run: |
          flutter pub get
          git diff --exit-code pubspec.lock || (echo "pubspec.lock is out of sync with pubspec.yaml" && exit 1)

      - name: Static Analysis
        run: flutter analyze

      - name: Format Check
        run: dart format --set-exit-if-changed .

      - name: Unit Tests
        run: flutter test

  build_android:
    name: "Android Production Build"
    needs: quality_gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true
      
      - run: flutter pub get

      - name: Create Dummy google-services.json for CI Build
        run: |
          mkdir -p android/app
          echo '{
            "project_info": {
              "project_number": "353624899972",
              "project_id": "grow-2538a",
              "storage_bucket": "grow-2538a.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:353624899972:android:99ad0ce03ea73efa59ddd1",
                  "android_client_info": {
                    "package_name": "com.idealab.mec.grow"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "353624899972-lagg46hbotpkjocdc4psnc53c3tiir19.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyApiKeyPlaceholderForCIBuildOnly"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "353624899972-lagg46hbotpkjocdc4psnc53c3tiir19.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }' > android/app/google-services.json

      - name: Build APK (Release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --verbose \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://placeholder.supabase.co}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-placeholder_anon_key}"
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: grow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  release:
    name: "GitHub Release"
    needs: build_android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: grow-release-apk
          path: build/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
