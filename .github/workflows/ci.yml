name: Grow~ CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  quality_gate:
    name: "Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Dependency Integrity
        run: |
          flutter pub get
          git diff --exit-code pubspec.lock || (echo "pubspec.lock is out of sync with pubspec.yaml" && exit 1)

      - name: Static Analysis (flutter analyze)
        run: flutter analyze

      - name: Format Check (dart format)
        run: dart format --set-exit-if-changed .

      - name: Unit & Widget Tests (flutter test)
        run: flutter test

      - name: Schema Contract Validation
        run: |
          echo "Checking for removed or invalid database columns..."
          INVALID_COLUMNS=(
            "system_role"
            "base_role"
            "duration_minutes"
            "cover_image_url"
            "interests"
            "show_github_graph"
            "is_blocked"
            "action_url"
            "full_name"
            "start_time"
            "end_time"
            "location_name"
          )
          FAILED=0
          for col in "${INVALID_COLUMNS[@]}"; do
            # Search Dart files for Supabase query mappings referencing invalid columns
            if grep -rn "'$col'" lib/ --include="*.dart" | \
               grep -E "\.select\(|\.insert\(|\.update\(|'$col'" | \
               grep -v "//"; then
              echo "❌ DRIFT DETECTED: '$col' found in code but deprecated or not in production database schema"
              FAILED=1
            fi
          done

          # Check event status enum values
          if grep -rn "'published'" lib/features/events/ --include="*.dart" | \
             grep -v "//"; then
            echo "❌ Invalid event status 'published' found — use 'upcoming'"
            FAILED=1
          fi
          if grep -rn "'active'" lib/features/events/ --include="*.dart" | \
             grep -v "//"; then
            echo "❌ Invalid event status 'active' found — use 'upcoming' or 'ongoing'"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
          echo "✅ Schema Contract check completed with 0 errors."

      - name: Secret Scan
        run: |
          echo "Scanning codebase for raw api keys or sensitive client credentials..."
          FAILED=0
          # Look for potential raw API keys or Client Secrets hardcoded in code files
          if grep -rn "AIzaSy" lib/ --include="*.dart"; then
            echo "❌ CRITICAL: Hardcoded Firebase/Google API key pattern (AIzaSy) found in Dart files!"
            FAILED=1
          fi
          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
          echo "✅ Secret scan completed with 0 errors."

      - name: Dependency Vulnerability Scan
        run: |
          echo "Scanning for outdated or insecure package dependencies..."
          flutter pub outdated

  build_apks:
    name: "Production Build"
    needs: quality_gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Google Services Configurations
        run: |
          mkdir -p android/app
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "353624899972",
              "project_id": "grow-2538a",
              "storage_bucket": "grow-2538a.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:353624899972:android:99ad0ce03ea73efa59ddd1",
                  "android_client_info": {
                    "package_name": "com.idealab.mec.grow"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "353624899972-lagg46hbotpkjocdc4psnc53c3tiir19.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyApiKeyPlaceholderForCIBuildOnly"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "353624899972-lagg46hbotpkjocdc4psnc53c3tiir19.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: |
          flutter build apk --debug --verbose \
            --dart-define=SUPABASE_URL="https://placeholder.supabase.co" \
            --dart-define=SUPABASE_ANON_KEY="placeholder_anon_key"

      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --verbose \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://placeholder.supabase.co}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-placeholder_anon_key}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: grow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: grow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  integration_test:
    name: "Integration Test Gate (Optional)"
    needs: quality_gate
    runs-on: ubuntu-latest
    # This runs integration tests; configured as optional or manual trigger to save resources
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Execute Integration Suite
        run: |
          echo "Starting integration suite (mock environment)..."
          # Typically runs flutter test integration_test/
