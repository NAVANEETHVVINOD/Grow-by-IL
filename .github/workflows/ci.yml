name: Grow CI

on:
  pull_request:
    branches:
      - main
      - develop
      - rc5-release-candidate
  push:
    branches:
      - main
      - develop
      - rc5-release-candidate
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality_gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: |
          git diff --exit-code pubspec.lock || (
            echo "pubspec.lock is out of sync with pubspec.yaml"
            exit 1
          )

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Architecture phase guard
        shell: bash
        run: |
          echo "Checking for gated architecture-phase changes..."

          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$(git rev-list --max-parents=0 HEAD)"
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_REF" HEAD)"
          echo "$CHANGED_FILES"

          BLOCKED=0
          GUARD_FILE=".github/ci/architecture_guard_paths.txt"

          while IFS= read -r line; do
            pattern="${line%%::*}"
            reason="${line#*::}"
            if [ -z "$pattern" ] || [[ "$pattern" =~ ^# ]]; then
              continue
            fi

            if echo "$CHANGED_FILES" | grep -E "$pattern"; then
              echo "$reason"
              BLOCKED=1
            fi
          done < "$GUARD_FILE"

          if [ "$BLOCKED" -eq 1 ]; then
            echo "Architecture phase guard failed. Use a UI-only reversible slice or complete the approval gate."
            exit 1
          fi

          echo "Architecture phase guard passed."

      - name: Schema contract validation
        shell: bash
        run: |
          echo "Checking for removed or invalid database columns..."
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$(git rev-list --max-parents=0 HEAD)"
          fi

          CHANGED_DART_FILES="$(git diff --name-only "$BASE_REF" HEAD -- 'lib/**/*.dart' || true)"
          if [ -z "$CHANGED_DART_FILES" ]; then
            echo "No changed Dart files under lib/. Schema contract validation skipped."
            exit 0
          fi

          INVALID_COLUMNS=(
            "system_role"
            "base_role"
            "duration_minutes"
            "cover_image_url"
            "interests"
            "show_github_graph"
            "is_blocked"
            "action_url"
            "full_name"
            "start_time"
            "end_time"
            "location_name"
          )

          FAILED=0
          for col in "${INVALID_COLUMNS[@]}"; do
            if echo "$CHANGED_DART_FILES" | xargs grep -n "'$col'" | grep -v "//"; then
              echo "Schema drift detected: '$col' is deprecated or not in the production schema."
              FAILED=1
            fi
          done

          CHANGED_EVENT_FILES="$(echo "$CHANGED_DART_FILES" | grep '^lib/features/events/' || true)"
          if [ -n "$CHANGED_EVENT_FILES" ] && echo "$CHANGED_EVENT_FILES" | xargs grep -n "'published'" | grep -v "//"; then
            echo "Invalid event status 'published' found. Use 'upcoming'."
            FAILED=1
          fi

          if [ -n "$CHANGED_EVENT_FILES" ] && echo "$CHANGED_EVENT_FILES" | xargs grep -n "'active'" | grep -v "//"; then
            echo "Invalid event status 'active' found. Use 'upcoming' or 'ongoing'."
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "Schema contract validation passed."

      - name: Secret scan
        shell: bash
        run: |
          echo "Scanning Dart code for raw API keys or sensitive client credentials..."
          FAILED=0

          if grep -rn "AIzaSy" lib/ --include="*.dart"; then
            echo "Hardcoded Firebase/Google API key pattern found in Dart files."
            FAILED=1
          fi

          if grep -rn "service_role" lib/ --include="*.dart"; then
            echo "Potential Supabase service role reference found in Dart files."
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "Secret scan passed."

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  debug_build:
    name: Debug APK Build
    needs: quality_gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI Firebase config
        run: |
          mkdir -p android/app
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "353624899972",
              "project_id": "grow-2538a",
              "storage_bucket": "grow-2538a.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:353624899972:android:99ad0ce03ea73efa59ddd1",
                  "android_client_info": {
                    "package_name": "com.idealab.mec.grow"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "353624899972-lagg46hbotpkjocdc4psnc53c3tiir19.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyApiKeyPlaceholderForCIBuildOnly"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "353624899972-lagg46hbotpkjocdc4psnc53c3tiir19.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="https://placeholder.supabase.co" \
            --dart-define=SUPABASE_ANON_KEY="placeholder_anon_key"

  release_build:
    name: Release APK Build
    needs: quality_gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://placeholder.supabase.co}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-placeholder_anon_key}"
